name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Server, policy, migration and Linux client (real symlinks, jq, flock)
        run: |
          command -v git jq curl flock
          git --version
          python3 server/manage.py client-manifest
          python3 -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Server, policy and PowerShell client with real junctions
        shell: powershell
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 installation and native junctions
        shell: powershell
        run: ./tests/windows_native.ps1
      - name: Hidden console and actual scheduled execution
        shell: powershell
        run: ./tests/verify-windows.ps1

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Electron UI tests (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: |
          command -v jq flock
          xvfb-run -a npm test
      - name: Electron UI tests
        if: runner.os == 'Windows'
        run: npm test
