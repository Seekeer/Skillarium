name: Skill portability and native clients

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Server and Linux integration tests
        run: |
          command -v git
          command -v jq
          python3 -m unittest discover -s tests -v

  windows:
    # Gitea does not provide hosted Windows VMs. Register a disposable native
    # Windows runner with the label windows-latest:host (see tests/README.md).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows filename policy
        shell: powershell
        run: |
          python -m unittest discover -s tests -p test_windows_paths.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 installation and native junctions
        shell: powershell
        run: ./tests/windows_native.ps1
      - name: Hidden console and actual scheduled execution
        shell: powershell
        run: ./tests/verify-windows.ps1
